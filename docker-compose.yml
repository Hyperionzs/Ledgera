# ============================================================================
# Ledgera — Docker Compose (Production-like)
# ============================================================================
# Usage:
#   docker compose up -d            # Start all services
#   docker compose down             # Stop all services
#   docker compose logs -f backend  # Tail backend logs
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ledgera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgera
      POSTGRES_PASSWORD: ledgera_dev
      POSTGRES_DB: ledgera_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledgera -d ledgera_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # NestJS Backend API
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ledgera-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ledgera:ledgera_dev@postgres:5432/ledgera_dev?schema=public
      CORS_ORIGIN: http://localhost
      JWT_SECRET: change-this-in-production
      JWT_EXPIRATION: 7d
    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # React Frontend (Nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ledgera-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
